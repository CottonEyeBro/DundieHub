[project]
name = "dundiehub"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "flask>=3.0.0",
  "flask-sqlalchemy>=3.1.1",
  "flask-migrate>=4.0.0",
  "flask-cors>=4.0.0",
  "flask-bcrypt>=1.0.1",
  "sqlalchemy-serializer>=1.4.1",
  "psycopg2-binary>=2.9.10",
  "psycopg[binary]>=3.2.3",
]

[tool.vercel]
entrypoint = "wsgi:app"
